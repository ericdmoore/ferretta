# DESIGN DRAFT: not accepted by the current CLI. See ../config-v1.md.
# Intent: review -> repair or human clarification -> review, until scoped LGTM
# or a bound is reached. Confirmations resume saved work; waiting is not compute.
# Numeric allowances are illustrative, not adopted defaults. Patch-size limits
# remain an open design question; this recipe does not reinterpret them as tokens.
schema_version = 1
objective = "cost"

[models.oss]
route = "local-oss" # Defined in the separate operator profile.
inference = "local"
context_tokens = 131072
max_output_tokens = 16384
[models.oss.thinking]
mode = "effort"
effort = "medium"

[checks]
commands = [["make", "check"]]
formatter = ["make", "fmt"]
github_required = [] # Repository protections still apply.
protected_paths = ["go.mod", "go.sum", ".go-version"]

[limits.repository]
spend_usd = "10.00" # Shared UTC-month ceiling; not permission for this PR to spend.
period = "calendar_month_utc"
[limits.pr]
compute = "60m" # Sum model + tool worker time, including final review and judge.
spend_usd = "0.00"
wall_clock = "5h" # From PR creation, including human waiting.
max_repairs = 4
max_reviews = 8
max_proposals = 6 # Versions count; duplicate delivery does not.
max_waves = 2
[limits.review]
compute = "10m"
max_turns = "unlimited" # Turns and repair cycles are separate controls.
[limits.repair]
compute = "10m"
max_turns = "unlimited"
[limits.evaluation]
compute = "10m"
[limits.reserve]
final_review_compute = "10m" # Inside the PR's 60m, not additional time.
evaluation_compute = "10m"

[[workflow.waves]]
id = "improve"
execution = "serial"
[workflow.waves.limits]
compute = "40m"
[[workflow.waves.stages]]
id = "repair-loop"
kind = "converge"
input = "pr.head"
reviewer = "oss"
repairer = "oss"
max_repairs = 4

[[workflow.waves]]
id = "acceptance"
execution = "serial"
[[workflow.waves.stages]]
id = "final-review"
kind = "review"
input = "repair-loop.revision"
reviewer = "oss"
evidence = ["repair-loop"]

[completion]
review = "final-review"
publish_repairs = true # Only the chosen checked candidate; operator grant required.
merge = "never"

[evaluation]
enabled = true
judge = "oss" # Separate read-only session; disclose shared model identity.
