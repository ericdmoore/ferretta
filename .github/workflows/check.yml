name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Shared local and CI checks
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check
      - name: Build downloadable binaries
        run: make build-all
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ferretta-binaries-${{ github.sha }}
          path: bin/ferretta-*
          if-no-files-found: error
          retention-days: 7
